name: dust
publish_to: none

environment:
  sdk: ">=3.6.0 <4.0.0"

workspace:
  - packages/dust_dart
  - packages/dust_flutter
  - packages/dust_db_sqlite3
  - packages/dust_db_postgres
  - packages/dust_server
  - fixtures/server_app
  - fixtures/server_codegen_app
  - fixtures/server_client_server
  - fixtures/server_client_app
  - fixtures/server_admin_client_app
  - fixtures/postgres_app
  - examples/product_showcase
  - examples/benchmark_project
  - examples/server_codegen

hooks:
  user_defines:
    sqlite3:
      source: system
      name: sqlite3
      name_windows: winsqlite3
