name: dust_db_postgres
description: PostgreSQL runtime for Dust Database. Executes build-time validated SQL and generated row mapping over package:postgres.
version: 0.3.0
homepage: https://github.com/dustcodegen/dust
repository: https://github.com/dustcodegen/dust
issue_tracker: https://github.com/dustcodegen/dust/issues
documentation: https://github.com/dustcodegen/dust/tree/main/packages/dust_db_postgres#readme
topics:
  - codegen
  - database
  - postgresql
  - sql
  - postgres

environment:
  sdk: ">=3.6.0 <4.0.0"

resolution: workspace

dependencies:
  dust_dart: ^0.3.0
  postgres: ^3.5.0

dev_dependencies:
  coverage: ^1.11.0
  test: ^1.26.0
  very_good_analysis: ^10.3.0
