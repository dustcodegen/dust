name: dust_db_sqlite3
description: SQLite runtime for Dust Database. Executes build-time validated SQL and generated row mapping over package:sqlite3.
version: 0.2.1
homepage: https://github.com/dustcodegen/dust
repository: https://github.com/dustcodegen/dust
issue_tracker: https://github.com/dustcodegen/dust/issues
documentation: https://github.com/dustcodegen/dust/tree/main/packages/dust_db_sqlite3#readme
topics:
  - codegen
  - database
  - sqlite
  - sql
  - sqlite3

environment:
  sdk: ">=3.10.0 <4.0.0"

resolution: workspace

dependencies:
  dust_dart: ^0.2.1
  sqlite3: ^3.3.0

dev_dependencies:
  coverage: ^1.11.0
  test: ^1.26.0
  very_good_analysis: ^10.3.0
